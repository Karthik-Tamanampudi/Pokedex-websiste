<!DOCTYPE html>
<html>
<head>
  <title>Pokédex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Pokédex</h1>

  <input id="dexNumber" type="number" placeholder="Enter Pokédex #">
  <button onclick="searchPokemon()">Search</button>

  <div id="pokemon">
    <img id="pokeImage" src="" alt="Pokémon Image">
    <p id="name"></p>
    <div id="type"></div>
    <p id="height"></p>
    <p id="weight"></p>
    <p id="description"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
